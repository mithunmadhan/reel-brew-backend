<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grow your Instagram with AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #fdf2f8 0%, #ede9fe 100%);
      color: #1f2937;
    }

    .card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.75rem;
      line-height: 1.3;
      background: linear-gradient(135deg, #db2777, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 0 0 32px;
      color: #6b7280;
      font-size: 1rem;
      line-height: 1.5;
    }

    button {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #db2777, #7c3aed);
      padding: 14px 32px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.45);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Grow your Instagram with AI</h1>
    <p>Connect your Instagram Business or Creator account to get AI-powered feedback, growth plans, and brand matches tailored to your content.</p>
    <button id="connect-btn" type="button">Connect Instagram</button>
    <p style="margin:20px 0 0; font-size:0.85rem;">
      <a href="dashboard.html" style="color:#7c3aed; font-weight:600; text-decoration:none;">Open my dashboard &rarr;</a>
    </p>
  </main>

  <script>
    // Uses localhost while you're testing this page on your own machine,
    // and automatically switches to the deployed API once this page itself
    // is served from somewhere other than localhost.
    var PROD_API_BASE = "https://reelbrew-api.onrender.com";
    var LOCAL_API_BASE = "http://127.0.0.1:8000";
    var isLocal = ["localhost", "127.0.0.1"].indexOf(window.location.hostname) !== -1;
    var apiBase = isLocal ? LOCAL_API_BASE : PROD_API_BASE;

    document.getElementById("connect-btn").addEventListener("click", function () {
      window.location.href = apiBase + "/auth/instagram/connect";
    });
  </script>
</body>
</html>
