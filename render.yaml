# Render "Blueprint" -- push this repo to GitHub, then in the Render
# dashboard choose "New +" -> "Blueprint" and point it at the repo.
# This project already uses a Supabase Postgres instance (see DATABASE_URL
# in your local .env), so no separate Render database is provisioned here --
# DATABASE_URL is just passed through as a secret.
services:
  - type: web
    name: reelbrew-api
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
